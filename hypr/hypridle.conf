###
# KeePassXC locking
#
# Previously this was handled by patching `omarchy-lock-screen` in
# ~/.local/share/omarchy/bin/ (see ../bin/README.md). The 2026-07-31 Omarchy
# update replaced that script with `omarchy-system-lock`, which only locks
# 1Password, so the patch stopped being reached.
#
# It is appended here instead: this file is tracked in the dotfiles repo, so
# unlike a patch to Omarchy's bin/ it survives `omarchy update`.
#
# Note: this covers idle, suspend and `loginctl lock-session`. Locking from
# the Omarchy menu calls `omarchy-system-lock` directly and bypasses this.
###

general {
    lock_cmd = omarchy-system-lock; pgrep -x keepassxc >/dev/null && keepassxc --lock                              # lock screen, 1password and keepassxc
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock; pgrep -x keepassxc >/dev/null && keepassxc --lock  # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = omarchy-system-lock; pgrep -x keepassxc >/dev/null && keepassxc --lock
    on-resume = omarchy-system-wake
}
